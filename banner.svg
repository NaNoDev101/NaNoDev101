<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Haval Hezha Zrar - Cybersecurity Student</title>
  <desc id="d">Dark terminal-style banner with the name Haval Hezha Zrar, Cybersecurity Student at Knowledge University.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0d1b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5a0"/>
      <stop offset="1" stop-color="#00c8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14303a" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1e3a45"/>
  <!-- terminal window bar -->
  <rect x="60" y="48" width="1080" height="204" rx="10" fill="#0a1218" stroke="#1e3a45"/>
  <path d="M60 58a10 10 0 0 1 10-10h1060a10 10 0 0 1 10 10v26H60z" fill="#112029"/>
  <circle cx="86" cy="66" r="6" fill="#ff5f56"/>
  <circle cx="108" cy="66" r="6" fill="#ffbd2e"/>
  <circle cx="130" cy="66" r="6" fill="#27c93f"/>
  <text x="600" y="71" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6c8794">haval@knu: ~</text>
  <!-- content -->
  <text x="92" y="122" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#00e5a0">$ whoami</text>
  <text x="92" y="176" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#e6f1f5">Haval Hezha Zrar</text>
  <rect x="92" y="190" width="220" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="92" y="226" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#00c8ff">Cybersecurity Student  |  Knowledge University (KNU)</text>
  <rect x="1040" y="205" width="12" height="24" fill="#00e5a0"/>
</svg>
