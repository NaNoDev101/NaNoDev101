<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">MrNaNo|N4N0 Staff - Cybersecurity Student</title>
  <desc id="d">Dark terminal-style animated banner with the name MrNaNo|N4N0 Staff, Cybersecurity Student at Knowledge University.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="1" stop-color="#0d1b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5a0"/>
      <stop offset="0.5" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#00e5a0"/>
      <animate attributeName="x1" values="-1;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14303a" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="win"><rect x="60" y="48" width="1080" height="204" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1e3a45"/>

  <!-- terminal window -->
  <rect x="60" y="48" width="1080" height="204" rx="10" fill="#0a1218" stroke="#00c8ff" stroke-opacity="0.45" filter="url(#glow)"/>
  <path d="M60 58a10 10 0 0 1 10-10h1060a10 10 0 0 1 10 10v26H60z" fill="#112029"/>
  <circle cx="86" cy="66" r="6" fill="#ff5f56"/>
  <circle cx="108" cy="66" r="6" fill="#ffbd2e"/>
  <circle cx="130" cy="66" r="6" fill="#27c93f"/>
  <text x="600" y="71" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6c8794">root@n4n0: ~ [secure shell]</text>

  <!-- drifting binary, clipped to the window -->
  <g clip-path="url(#win)" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#00e5a0" opacity="0.16">
    <g><text x="760" y="100">1 0 1 1 0 0 1</text><text x="760" y="130">0 1 0 0 1 1 0</text><text x="760" y="160">1 1 0 1 0 1 1</text><text x="760" y="190">0 0 1 0 1 0 0</text><text x="760" y="220">1 0 1 1 0 1 0</text><text x="760" y="250">0 1 1 0 0 1 1</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -60" dur="6s" repeatCount="indefinite"/></g>
    <g><text x="910" y="100">N 4 N 0</text><text x="910" y="130">0 1 1 0 1</text><text x="910" y="160">1 0 0 1 0</text><text x="910" y="190">S T A F F</text><text x="910" y="220">0 1 0 1 1</text><text x="910" y="250">1 1 0 0 1</text>
      <animateTransform attributeName="transform" type="translate" values="0 -60;0 0" dur="8s" repeatCount="indefinite"/></g>
    <g><text x="1040" y="100">0 1 0 1</text><text x="1040" y="130">1 1 0 0</text><text x="1040" y="160">0 0 1 1</text><text x="1040" y="190">1 0 1 0</text><text x="1040" y="220">0 1 1 1</text><text x="1040" y="250">1 0 0 1</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -60" dur="5s" repeatCount="indefinite"/></g>
  </g>

  <!-- content -->
  <text x="92" y="122" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#00e5a0">$ whoami</text>

  <!-- glitch layers -->
  <text x="92" y="176" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#ff2d95" opacity="0">MrNaNo|N4N0 Staff
    <animate attributeName="opacity" values="0;0;0.75;0;0;0.6;0" keyTimes="0;0.86;0.88;0.9;0.95;0.96;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="92;92;86;92;92;97;92" keyTimes="0;0.86;0.88;0.9;0.95;0.96;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="92" y="176" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#00c8ff" opacity="0">MrNaNo|N4N0 Staff
    <animate attributeName="opacity" values="0;0;0.75;0;0;0.6;0" keyTimes="0;0.86;0.88;0.9;0.95;0.96;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="92;92;98;92;92;87;92" keyTimes="0;0.86;0.88;0.9;0.95;0.96;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- main name -->
  <text x="92" y="176" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#e6f1f5" filter="url(#glow)"><tspan>MrNaNo</tspan><tspan fill="#00e5a0">|</tspan><tspan fill="#00c8ff">N4N0</tspan><tspan fill="#e6f1f5"> Staff</tspan></text>

  <rect x="92" y="190" width="340" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="40;340;340;40" keyTimes="0;0.4;0.85;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="92" y="226" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#00c8ff">&gt; Cybersecurity Student  |  Knowledge University (KNU)</text>

  <!-- blinking cursor -->
  <rect x="1040" y="205" width="12" height="24" fill="#00e5a0" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scanlines + vignette overlay -->
  <rect width="1200" height="300" fill="url(#scan)"/>
  <rect width="1200" height="300" fill="url(#vig)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#00e5a0" opacity="0.12">
    <animate attributeName="y" values="-10;300" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
